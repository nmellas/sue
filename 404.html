<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — SUE</title>
<script>
  /* Si alguien abre p/N.html antes de que se genere (tarda hasta una hora),
     se le lleva al artículo normal para que igual pueda leerlo. */
  (function () {
    var m = location.pathname.match(/^(.*\/)p\/(\d+)\.html$/);
    if (m) location.replace(m[1] + "articulo.html?id=" + m[2]);
  })();
</script>
<link rel="stylesheet" href="/sue/styles.css">
<link rel="icon" type="image/png" href="/sue/favicon.png">
</head>
<body>
<main class="article-container" style="text-align:center;padding-top:120px;">
  <span class="eyebrow">Error 404</span>
  <h1>No encontramos esta página</h1>
  <p style="margin:0 auto 28px;max-width:44ch;">Puede que el enlace esté incompleto o que la página ya no exista.</p>
  <a class="btn btn-primary" href="/sue/index.html">Volver al inicio</a>
</main>
</body>
</html>
