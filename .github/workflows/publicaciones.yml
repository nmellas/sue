# Genera una página por publicación (carpeta p/) para que cada una tenga
# su propia vista previa al compartirla. Corre cada hora y también a mano
# desde la pestaña Actions → "Páginas de publicaciones" → Run workflow.
name: Páginas de publicaciones

on:
  schedule:
    - cron: "15 * * * *"   # cada hora, al minuto 15
  workflow_dispatch:        # botón para ejecutarlo a mano
  push:
    paths:
      - "articulo.html"
      - "publicaciones-data.js"
      - "scripts/generar-publicaciones.mjs"

permissions:
  contents: write

# Nunca corren dos ejecuciones a la vez (evita choques al guardar)
concurrency:
  group: paginas-publicaciones
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/generar-publicaciones.mjs
      - name: Guardar cambios (solo si hay)
        run: |
          git config user.name "SUE bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A p
          if git diff --staged --quiet; then
            echo "Sin cambios en las páginas."
            exit 0
          fi
          git commit -m "Actualizar páginas de publicaciones"
          # Si alguien hizo un commit mientras corría la tarea, se incorpora y se reintenta
          for intento in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            echo "Reintentando ($intento)…"
            sleep 5
          done
          exit 1
